services:
  - type: web
    name: cryptoguard-ai
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: "https://cryptoguard-ai.onrender.com,http://localhost:8000,http://127.0.0.1:8000,*"
